[project]
name = "vilens"
version = "0.1.0"
description = "Deterministic multilingual data-building pipeline"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "en-core-web-sm",
    "fasttext-numpy2-wheel>=0.9.2",
    "huggingface-hub>=1.33.0",
    "nltk>=3.10.3",
    "opencc-python-reimplemented>=0.1.7",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0,<7.0",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.16",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "wordfreq[cjk]>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
