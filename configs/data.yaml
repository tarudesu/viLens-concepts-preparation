seed: 20260925

langs:
  - vi
  - en
  - zh
  - fr
  - id

paths:
  raw: data/raw
  interim: data/interim
  out: data/
  build: data/build
  prompts: data/prompts
  tests: tests
  logs: data/interim/logs
  dropflow: data/interim/dropflow.jsonl
  sources: data/build/SOURCES.md

attest:
  report_sample_n: 10
  syllable_bins: [1, 2] # 1, 2, and 3+ whitespace-separated Vietnamese syllables
  paths:
    pool: data/interim/03_pool.parquet
    output: data/interim/04_attested.parquet
    vietnamese_dump: data/raw/wiktextract_vi/kaikki.org-dictionary-Vietnamese.jsonl
    muse_vi_en: data/raw/muse/vi-en.txt
    muse_en_vi: data/raw/muse/en-vi.txt
    wikidata_cache: data/raw/wikidata_cache

split:
  component_max_size: 5
  syllable_bins: [1, 2] # 1, 2, and 3+ whitespace-separated Vietnamese syllables
  syllable_source: first_vi_candidate
  parquet_row_group_size: 65536
  paths:
    input: data/interim/04_attested.parquet
    output: data/interim/05_split.parquet
    fewshot_reservoir: data/interim/05_fewshot_reservoir.parquet
    directions: data/interim/05_directions.parquet
    test_pool: data/interim/05_test_pool.parquet

logging:
  level: INFO
  progress_every: 500

chinese:
  lang_code: cmn
  split_on: "/"
  prefer_simplified: true

pool:
  pos_keep: [noun, verb, adj]
  max_en_words: 2
  drop_tags: [obsolete, archaic, dated, rare, dialectal, historical]
  translation_locations: [top, senses]
  max_item_drop_rate: 0.02

heldout:
  fewshot_reservoir_n: 80
  fewshot_final_n: 30
  directions_n: 220
  stratify_by: [pos, syllable_bucket]
  fewshot_min_en_zipf_tercile: top

filters:
  min_sources: 2
  attestation_sources: [wiktextract_table, vi_gloss, muse, wikidata]
  polysemy_percentile: 50
  surface_edit_threshold: 0.45
  zh_forbid_latin: true
  zh_adj_strip_de: true
  polysemy_count: sum_over_homograph_entries
  surface_compare: all_candidates
  surface_norm:
    remove_chars: [" ", "-", "'"]
    vi_replace: {ph: f}
  loanword:
    drop_source_langs: [fr, en, la, la-new, la-lat, la-med, grc, pt, es, it, de, nl, ru, ms, id]
    drop_source_lang_prefixes: ["en-", "fr-", "es-", "pt-"]
    loan_templates: [bor, "bor+", lbor, der, "der+", obor]
    previous_rule_for_comparison:
      loan_templates: [bor, "bor+", lbor, der, "der+", cal, calque, obor]
      chinese_codes: [zh, cmn, ltc, och, yue]
      chinese_prefix: "zh-"
  surface_compare_langs:
    - en
    - fr
    - id
  report:
    surface_histogram_bin_width: 0.05
    surface_near_threshold_n: 30
    dedup_examples_n: 15
    loanword_examples_n: 15
    hyphen_examples_n: 20
    orth_merge_examples_n: 10

filter:
  paths:
    input: data/interim/05_split.parquet
    output: data/interim/06_filtered.parquet
    loanword_audit: data/interim/06_loanword_audit.parquet

nllb:
  model: facebook/nllb-200-distilled-600M
  revision: f8d333a098d19b4fd9a8b18f94170487ad3f821d
  num_beams: 5
  num_return: 5
  batch_size: 64
  max_new_tokens: 16
  do_sample: false
  cache_dir: data/raw/nllb_translation_cache
  lang_codes: {vi: vie_Latn, en: eng_Latn, zh: zho_Hans, fr: fra_Latn, id: ind_Latn}
  test_input: máy tính
  test_source_lang: vie_Latn
  test_target_lang: eng_Latn

backtranslate:
  bt:
    max_extra_syllables: 4
  paths:
    input: data/interim/06_filtered.parquet
    output: data/interim/07_bt.parquet
  report:
    failure_sample_n: 30
    new_pass_sample_n: 30
    still_fail_sample_n: 20
    promotion_examples_n: 15
    change_examples_n: 20
    prioritize_en_lemmas: [fourth, sixth]
    syllable_bins: [1, 2]

etymology:
  sinitic_codes: [zh, cmn, ltc, och, lzh, lzh-lit, yue, hak, wuu, cdo, gan, hsn]
  sinitic_prefixes: ["zh-", "nan"]
  sino_japanese_codes: [ja, ko]   # Sino only if args["3"] contains CJK
  loan_templates: [bor, "bor+", lbor, obor, der, "der+"]
  calque_templates: [cal, calque]
  native_markers_text: [Proto-Vietic, Proto-Mon-Khmer, Proto-Austroasiatic]
  native_templates: [inh, "inh+"]
  gloss_overlap_min: 1
  template_variant_separator: "/"
  max_template_combinations: 16
  bootstrap_resamples: 1000
  bootstrap_confidence: 0.95
  power_alpha: 0.05
  power_holm_comparisons: 6
  power_target: 0.80
  h3_confirmatory_kappa_lower_min: 0.60
  h3_confirmatory_holm_mde_max: 0.30
  report:
    failure_examples_per_reason: 10
    nonsino_sino_examples_max: 30
    syllable_bins: [1, 2]
  paths:
    input: data/interim/07_bt.parquet
    output: data/interim/08_etym.parquet
    vietnamese_dump: data/raw/wiktextract_vi/kaikki.org-dictionary-Vietnamese.jsonl
    unihan_readings: data/raw/unihan/extracted/Unihan_Readings.txt
    unihan_variants: data/raw/unihan/extracted/Unihan_Variants.txt
    cedict: data/raw/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz
    nltk_data: data/raw/nltk_data

wikidata:
  enabled: true
  backend: api # api or sparql
  endpoint: https://query.wikidata.org/sparql
  batch_size: 200
  api_endpoint: https://www.wikidata.org/w/api.php
  api_search_limit: 10
  entity_batch_size: 50
  connectivity_timeout_seconds: 20
  min_interval_seconds: 1.0
  timeout_seconds: 60
  max_retries: 5
  retry_backoff_seconds: 2.0
  user_agent: "viLens-research-data-pipeline/0.1 (Wikidata attestation; contact: luannt@uit.edu.vn)"

downloads:
  min_free_bytes: 60000000000
  chunk_size_bytes: 1048576
  timeout_seconds: 60
  retries: 3
  retry_backoff_seconds: 1.0
  user_agent: "viLens-research-data-pipeline/0.1 (source-download; contact: luannt@uit.edu.vn)"
  wiktextract:
    english_page: https://kaikki.org/dictionary/English/
    vietnamese_page: https://kaikki.org/dictionary/Vietnamese/
    source_page: https://kaikki.org/dictionary/rawdata.html
  muse:
    base_url: https://dl.fbaipublicfiles.com/arrival/dictionaries/
    files: [vi-en.txt, en-vi.txt]
    page: https://github.com/facebookresearch/MUSE
  unihan:
    url: https://www.unicode.org/Public/UCD/latest/ucd/Unihan.zip
    version_url: https://www.unicode.org/Public/UCD/latest/ucd/ReadMe.txt
    terms_url: https://www.unicode.org/terms_of_use.html
  cedict:
    url: https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz
    page: https://cc-cedict.org/editor/editor.php?handler=Download
  brysbaert:
    url: https://www.humanities.mcmaster.ca/~vickup/Concreteness_ratings_Brysbaert_et_al_BRM.csv
    manual_url: https://doi.org/10.3758/s13428-013-0403-5
  flores:
    repo: openlanguagedata/flores_plus
    revision: 5fec6c13f9e5a4db2f745d4ec0d7c9721ddc4f06
    page: https://huggingface.co/datasets/openlanguagedata/flores_plus
    splits: [dev, devtest]
    languages: [vie_Latn, eng_Latn, cmn_Hans, fra_Latn, ind_Latn]
  lid:
    glotlid_repo: cis-lmu/glotlid
    glotlid_revision: 85cd6716494360367b75f642b5bc78667605d0b4
    fasttext_url: https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin
    test_text: Tôi đang học tiếng Việt
    top_k: 1
  wordnet:
    corpus: wordnet
    directory: nltk_data

models:
  gemma:
    hf_id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
  qwen:
    hf_id: Qwen/Qwen3-4B
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
  llama:
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95

tokens:
  context_prefix: "x:"
  use_fast: true
  e1_gate_share_threshold: 0.60
  m1_min_single_token_n: 150
  paths:
    input: data/interim/09_cov.parquet
    output: data/interim/10_tok.parquet
    tokenizer_cache: data/raw/hf_tokenizers

covariates:
  pending_concreteness_label: pending
  paths:
    input: data/interim/08_etym.parquet
    output: data/interim/09_cov.parquet

concreteness:
  paths:
    raw_dir: data/raw/brysbaert
    main_input: data/interim/11_diac.parquet
    main_output: data/interim/11_diac.parquet
    extension_input: data/interim/11_m1_ext.parquet
    extension_output: data/interim/11_m1_ext.parquet
    sources: data/build/SOURCES.md
  csv:
    word_column: Word
    value_column: Conc.M
  xlsx:
    word_column: Word
    value_column: Conc.M
    bigram_column: Bigram
    raters_column: Total
  spacy_model: en_core_web_sm

fertility:
  character_unit: unicode_codepoints_including_spaces
  paths:
    flores_dir: data/raw/flores
    output: data/interim/e1_fertility.csv

direction_flores:
  fit_fraction: 0.8
  id_column: id
  sentence_column: sentence
  languages: [vi, en, zh, fr, id]
  codes: {vi: vie_Latn, en: eng_Latn, zh: cmn_Hans, fr: fra_Latn, id: ind_Latn}
  paths:
    flores_dir: data/raw/flores
    output: data/prompts/directions_flores.jsonl

release:
  hf_repo: tarudesu/viLens-concepts
  private: true
  include_concreteness_values: false # Enable only after Brysbaert terms are confirmed.
  drop_columns: [in_muse]
  package:
    output_dir: release
    input_concepts: data/concepts.tsv
    prompts_dir: data/prompts
    agreement: data/agreement.md
    amendments: PROTOCOL_AMENDMENTS.md
    prereg: PREREG.md
    sources: data/build/SOURCES.md
    card_template: data/build/15_release_card.md
    scripts_source: data/build/release_scripts
    flores_dir: data/raw/flores
    muse_vi_en: data/raw/muse/vi-en.txt
    muse_en_vi: data/raw/muse/en-vi.txt
    brysbaert: data/raw/brysbaert/13428_2013_403_MOESM1_ESM.xlsx
  require_resolved_concreteness: true
  qa_sample_per_stratum: 50
  paths:
    input: data/interim/12_ru.parquet
    dropflow: data/interim/dropflow.jsonl
    sources: data/build/SOURCES.md
    protocol: PROTOCOL_AMENDMENTS.md
    output_tsv: data/concepts.tsv
    agreement: data/agreement.md
    licenses: data/LICENSES.md
    qa_sample: data/interim/qa_sample.txt
    fertility: data/interim/e1_fertility.csv
    flores_directions: data/prompts/directions_flores.jsonl

diacritics:
  wordfreq_top_n: 50000 # wordfreq returns its complete Vietnamese vocabulary (10,622 entries)
  expected_wordfreq_n: 10622
  max_collapse_partners: 3
  report_examples_n: 20
  paths:
    input: data/interim/10_tok.parquet
    output: data/interim/11_diac.parquet
    vietnamese_dump: data/raw/wiktextract_vi/kaikki.org-dictionary-Vietnamese.jsonl

m1_extension:
  target_n_senses_vi: 2
  target_syllables: 1
  candidate_polysemy_percentile: 100 # diagnostic pass only; frozen cutoffs restored before acceptance
  paths:
    step05: data/interim/05_split.parquet
    main_step06: data/interim/06_filtered.parquet
    main_step07: data/interim/07_bt.parquet
    main_step11: data/interim/11_diac.parquet
    output: data/interim/11_m1_ext.parquet

prompts:
  label: {vi: "Tiếng Việt", ru: "Русский"}
  translation:
    src_lang: ru
    k: 5
    nllb_target_code: rus_Cyrl
  repetition:
    k: 5
  cloze:
    k: 3
    min_test_concepts_primary: 300
    cloze_status: supplementary # Computed on main-test concepts only.
    answer_label: "Đáp án:"
    max_syllables: 25
  cloze_v13:
    min_query_tokens: 6
    preferred_example_min_tokens: 8
    min_canonical_occurrences: 1
    max_canonical_occurrences: 1
    demo_count: 3
    preferred_demo_vi: ["nghiên cứu", "bạo lực"]
    maximum_main_survivors: 61 # Stop if the stricter rebuild exceeds the prior audit upper bound.
    maximum_extension_survivors: 7 # Accepted bound after the untruncated top-beam rerun admitted three concepts.
    nllb_max_new_tokens: 256 # C7 flags and excludes every beam that consumes this full budget.
    forbidden_characters: ["(", ")", "[", "]", "/", "|", "~"]
    semantic_use_all_returned_beams: false # C7 uses the top beam only; outputs that hit the token limit never count.
    spacy_batch_size: 128
    survivor_sample_n: 25
    paths:
      dropped_csv: data/interim/dropped_cloze.csv
      candidate_failures: data/interim/cloze_candidate_failures.jsonl
      audit_report: data/interim/cloze_v13_report.json
      output_dir: data/prompts/v1.3
  fewshot:
    n_final: 30
    n_sets: 6
    set_size: 5
    primary_set: 1
    minimum_eligible_n: 20 # Stop if fewer; otherwise choose whole sets of five.
  target_splits: [test]
  paths:
    english_dump: data/raw/wiktextract_en/kaikki.org-dictionary-English.jsonl
    main_step11: data/interim/11_diac.parquet
    extension: data/interim/11_m1_ext.parquet
    ru_output: data/interim/12_ru.parquet
    fewshot_metadata: data/interim/12_fewshot.json
    output_dir: data/prompts

direction_prompts:
  expected_concepts: 132
  fit_fraction: 0.8
  fewshot_set: 1
  languages: [vi, en, zh, fr, id]
  labels: {vi: "Tiếng Việt", en: "English", zh: "中文", fr: "Français", id: "Bahasa Indonesia"}
  formats: [repetition, translation]
  paths:
    input: data/interim/12_ru.parquet
    output: data/prompts/directions_matched.jsonl

inspection:
  english_vietnamese_n: 40
  english_pretty_n: 5
  vietnamese_sample_n: 40
  vietnamese_print_n: 15
  unihan_print_n: 10
  language_aliases:
    vi: [vietnamese, vi, vie, vie_latn]
    en: [english, en, eng, eng_latn]
    zh: [chinese, mandarin, zh, zho, cmn, cmn_hans]
    fr: [french, fr, fra, fre, fra_latn]
    id: [indonesian, bahasa indonesia, id, ind, ind_latn]
  cjk_ranges:
    - [13312, 19903]
    - [19968, 40959]
    - [131072, 173791]
  yield:
    recursive_discovery_entries: 50000
    trans_marker_entries: 200000
    spot_lemmas: [water, computer, dog, house, eat, book, red, hospital, research, tree, go, big, mother, school, money]
    subpage_examples: 10
    mandarin_nonmatch_examples: 10
    category_names_top_n: 60
    etymology_templates_top_n: 40
    cjk_tag_sets_top_n: 3
    cjk_examples_per_tag_set: 10
    mandarin_code: cmn
    mandarin_exact_lang_names: [Chinese, Chinese Mandarin]
    mandarin_required_tag: Mandarin
    simplified_tag: Simplified
    traditional_tag: Traditional
    subpage_markers: [trans-see, see-translation, translation subpage]
    proto_terms: [Proto-Vietic, Proto-Mon-Khmer, Proto-Austroasiatic]
