seed: 20260925

langs:
  - vi
  - en
  - zh
  - fr
  - id

paths:
  raw: data/raw
  interim: data/interim
  out: data/
  build: data/build
  prompts: data/prompts
  tests: tests
  logs: data/interim/logs
  dropflow: data/interim/dropflow.jsonl
  sources: data/build/SOURCES.md

attest:
  report_sample_n: 10
  syllable_bins: [1, 2] # 1, 2, and 3+ whitespace-separated Vietnamese syllables
  paths:
    pool: data/interim/03_pool.parquet
    output: data/interim/04_attested.parquet
    vietnamese_dump: data/raw/wiktextract_vi/kaikki.org-dictionary-Vietnamese.jsonl
    muse_vi_en: data/raw/muse/vi-en.txt
    muse_en_vi: data/raw/muse/en-vi.txt
    wikidata_cache: data/raw/wikidata_cache

split:
  component_max_size: 5
  syllable_bins: [1, 2] # 1, 2, and 3+ whitespace-separated Vietnamese syllables
  syllable_source: first_vi_candidate
  parquet_row_group_size: 65536
  paths:
    input: data/interim/04_attested.parquet
    output: data/interim/05_split.parquet
    fewshot_reservoir: data/interim/05_fewshot_reservoir.parquet
    directions: data/interim/05_directions.parquet
    test_pool: data/interim/05_test_pool.parquet

logging:
  level: INFO
  progress_every: 500

chinese:
  lang_code: cmn
  split_on: "/"
  prefer_simplified: true

pool:
  pos_keep: [noun, verb, adj]
  max_en_words: 2
  drop_tags: [obsolete, archaic, dated, rare, dialectal, historical]
  translation_locations: [top, senses]
  max_item_drop_rate: 0.02

heldout:
  fewshot_reservoir_n: 80
  fewshot_final_n: 30
  directions_n: 220
  stratify_by: [pos, syllable_bucket]
  fewshot_min_en_zipf_tercile: top

filters:
  min_sources: 2
  attestation_sources: [wiktextract_table, vi_gloss, muse, wikidata]
  polysemy_percentile: 50
  surface_edit_threshold: 0.45
  zh_forbid_latin: true
  zh_adj_strip_de: true
  polysemy_count: sum_over_homograph_entries
  surface_compare: all_candidates
  surface_norm:
    remove_chars: [" ", "-", "'"]
    vi_replace: {ph: f}
  loanword:
    drop_source_langs: [fr, en, la, la-new, la-lat, la-med, grc, pt, es, it, de, nl, ru, ms, id]
    drop_source_lang_prefixes: ["en-", "fr-", "es-", "pt-"]
    loan_templates: [bor, "bor+", lbor, der, "der+", obor]
    previous_rule_for_comparison:
      loan_templates: [bor, "bor+", lbor, der, "der+", cal, calque, obor]
      chinese_codes: [zh, cmn, ltc, och, yue]
      chinese_prefix: "zh-"
  surface_compare_langs:
    - en
    - fr
    - id
  report:
    surface_histogram_bin_width: 0.05
    surface_near_threshold_n: 30
    dedup_examples_n: 15
    loanword_examples_n: 15
    hyphen_examples_n: 20

filter:
  paths:
    input: data/interim/05_split.parquet
    output: data/interim/06_filtered.parquet
    loanword_audit: data/interim/06_loanword_audit.parquet

nllb:
  model: facebook/nllb-200-distilled-600M
  revision: f8d333a098d19b4fd9a8b18f94170487ad3f821d
  num_beams: 5
  num_return: 5
  batch_size: 64
  max_new_tokens: 16
  do_sample: false
  cache_dir: data/raw/nllb_translation_cache
  lang_codes: {vi: vie_Latn, en: eng_Latn, zh: zho_Hans, fr: fra_Latn, id: ind_Latn}
  test_input: máy tính
  test_source_lang: vie_Latn
  test_target_lang: eng_Latn

backtranslate:
  bt:
    max_extra_syllables: 4
  paths:
    input: data/interim/06_filtered.parquet
    output: data/interim/07_bt.parquet
  report:
    failure_sample_n: 30
    new_pass_sample_n: 30
    still_fail_sample_n: 20
    change_examples_n: 20
    prioritize_en_lemmas: [fourth, sixth]
    syllable_bins: [1, 2]

wikidata:
  enabled: true
  backend: api # api or sparql
  endpoint: https://query.wikidata.org/sparql
  batch_size: 200
  api_endpoint: https://www.wikidata.org/w/api.php
  api_search_limit: 10
  entity_batch_size: 50
  connectivity_timeout_seconds: 20
  min_interval_seconds: 1.0
  timeout_seconds: 60
  max_retries: 5
  retry_backoff_seconds: 2.0
  user_agent: "viLens-research-data-pipeline/0.1 (Wikidata attestation; contact: luannt@uit.edu.vn)"

downloads:
  min_free_bytes: 60000000000
  chunk_size_bytes: 1048576
  timeout_seconds: 60
  retries: 3
  retry_backoff_seconds: 1.0
  user_agent: "viLens-research-data-pipeline/0.1 (source-download; contact: luannt@uit.edu.vn)"
  wiktextract:
    english_page: https://kaikki.org/dictionary/English/
    vietnamese_page: https://kaikki.org/dictionary/Vietnamese/
    source_page: https://kaikki.org/dictionary/rawdata.html
  muse:
    base_url: https://dl.fbaipublicfiles.com/arrival/dictionaries/
    files: [vi-en.txt, en-vi.txt]
    page: https://github.com/facebookresearch/MUSE
  unihan:
    url: https://www.unicode.org/Public/UCD/latest/ucd/Unihan.zip
    version_url: https://www.unicode.org/Public/UCD/latest/ucd/ReadMe.txt
    terms_url: https://www.unicode.org/terms_of_use.html
  cedict:
    url: https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz
    page: https://cc-cedict.org/editor/editor.php?handler=Download
  brysbaert:
    url: https://www.humanities.mcmaster.ca/~vickup/Concreteness_ratings_Brysbaert_et_al_BRM.csv
    manual_url: https://doi.org/10.3758/s13428-013-0403-5
  flores:
    repo: openlanguagedata/flores_plus
    revision: 5fec6c13f9e5a4db2f745d4ec0d7c9721ddc4f06
    page: https://huggingface.co/datasets/openlanguagedata/flores_plus
    splits: [dev, devtest]
    languages: [vie_Latn, eng_Latn, cmn_Hans, fra_Latn, ind_Latn]
  lid:
    glotlid_repo: cis-lmu/glotlid
    glotlid_revision: 85cd6716494360367b75f642b5bc78667605d0b4
    fasttext_url: https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin
    test_text: Tôi đang học tiếng Việt
    top_k: 1

models:
  gemma:
    hf_id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
  qwen:
    hf_id: Qwen/Qwen3-4B
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
  llama:
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95

inspection:
  english_vietnamese_n: 40
  english_pretty_n: 5
  vietnamese_sample_n: 40
  vietnamese_print_n: 15
  unihan_print_n: 10
  language_aliases:
    vi: [vietnamese, vi, vie, vie_latn]
    en: [english, en, eng, eng_latn]
    zh: [chinese, mandarin, zh, zho, cmn, cmn_hans]
    fr: [french, fr, fra, fre, fra_latn]
    id: [indonesian, bahasa indonesia, id, ind, ind_latn]
  cjk_ranges:
    - [13312, 19903]
    - [19968, 40959]
    - [131072, 173791]
  yield:
    recursive_discovery_entries: 50000
    trans_marker_entries: 200000
    spot_lemmas: [water, computer, dog, house, eat, book, red, hospital, research, tree, go, big, mother, school, money]
    subpage_examples: 10
    mandarin_nonmatch_examples: 10
    category_names_top_n: 60
    etymology_templates_top_n: 40
    cjk_tag_sets_top_n: 3
    cjk_examples_per_tag_set: 10
    mandarin_code: cmn
    mandarin_exact_lang_names: [Chinese, Chinese Mandarin]
    mandarin_required_tag: Mandarin
    simplified_tag: Simplified
    traditional_tag: Traditional
    subpage_markers: [trans-see, see-translation, translation subpage]
    proto_terms: [Proto-Vietic, Proto-Mon-Khmer, Proto-Austroasiatic]
